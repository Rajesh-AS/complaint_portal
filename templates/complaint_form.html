{% extends "base.html" %}
{% block title %}Submit Complaint — Complaint Portal{% endblock %}

{% block content %}
<div class="auth-container" style="max-width:600px;">
    <div class="auth-card">
        <h2>Submit a Complaint</h2>
        <p class="subtitle">Fill in the details below to submit your complaint</p>

        <form method="POST" action="{{ url_for('new_complaint') }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control"
                       placeholder="Brief title of your complaint" required maxlength="200">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control"
                          placeholder="Describe your complaint in detail..." required></textarea>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-control" required>
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" class="form-control" required>
                    {% for p in priorities %}
                        <option value="{{ p }}" {% if p == 'Medium' %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Submit Complaint</button>
        </form>
    </div>
</div>
{% endblock %}
